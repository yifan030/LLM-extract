# ============================================================
# Exam Extract API — Docker Compose 部署
#
# 用法:
#   docker compose up -d              # 启动
#   docker compose logs -f            # 查看日志
#   docker compose down               # 停止
#   docker compose build --no-cache   # 重新构建
# ============================================================
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: ["etcd", "-advertise-client-urls=http://127.0.0.1:2379",
              "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    volumes:
      - ./volumes/etcd:/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - ./volumes/milvus-minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - milvus-minio

  api:
    image: exam-extract:1.0
    container_name: exam-extract
    restart: unless-stopped
    network_mode: host
    environment:
      # ── LLM ──
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-16384}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-120.0}

      # ── MinIO ──
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-llm-construct}
      - MINIO_SECURE=${MINIO_SECURE:-false}

      # ── Redis ──
      - REDIS_URL=${REDIS_URL}

      # ── HugeGraph ──
      - HG_HOST=${HG_HOST}
      - HG_PORT=${HG_PORT:-50045}
      - HG_USER=${HG_USER:-admin}
      - HG_PASSWD=${HG_PASSWD:-admin}
      - HG_GRAPHSPACE=${HG_GRAPHSPACE:-DEFAULT}
      - HG_GRAPH=${HG_GRAPH:-edu}

      # ── OCR 服务 ──
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-http://202.107.249.39:50108/api/v1/construct-question/ocr-parse}

      # ── Milvus ──
      - MILVUS_URI=${MILVUS_URI:-http://localhost:19530}
      - MILVUS_DB=${MILVUS_DB:-default}
      - MILVUS_QUESTION_COLLECTION=${MILVUS_QUESTION_COLLECTION:-question_embed_v1}
      - MILVUS_KP_COLLECTION=${MILVUS_KP_COLLECTION:-kp_embed_v1}

      # ── Embedding ──
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-https://api.deepseek.com}
      - EMBED_MODEL=${EMBED_MODEL:-deepseek-embed}
      - EMBED_DIM=${EMBED_DIM:-1024}
      - EMBED_TIMEOUT=${EMBED_TIMEOUT:-60.0}

      # ── App ──
      - DEBUG=${DEBUG:-false}
      - OUTPUT_DIR=${OUTPUT_DIR:-tmp/extractions}
    volumes:
      # 持久化临时输出（可选）
      - ./tmp:/app/tmp
