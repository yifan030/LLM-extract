# ============================================================
# Exam Extract API — Docker Compose 生产环境
#
# 用法:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
# 注意:
#   - 服务器已运行 Milvus/Redis/MinIO 等中间件，本文件仅部署 API 服务
#   - 使用 host 网络模式以访问宿主机 127.0.0.1 上的中间件
#   - API 直接监听宿主机 8085 端口 (network_mode: host 时 ports 无效)
#   - 构建时需交叉编译为 linux/amd64（Mac ARM → 服务器 x86_64）
#   - 部署前请确认 .env.prod 中的密码/密钥已配置正确
# ============================================================

services:
  exam-extract:
    image: exam-extract:1.1
    container_name: exam-extract
    restart: always
    network_mode: host
    environment:
      # ── LLM ──
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-16384}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-120.0}

      # ── MinIO (服务器已运行，宿主机 127.0.0.1:8999) ──
      - MINIO_ENDPOINT=127.0.0.1:8999
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-llm-construct}
      - MINIO_SECURE=${MINIO_SECURE:-false}

      # ── Redis (服务器已运行，宿主机 127.0.0.1:8369) ──
      - REDIS_URL=redis://:Baidu12345@127.0.0.1:8369/10

      # ── HugeGraph (外部服务) ──
      - HG_HOST=${HG_HOST:-202.107.249.39}
      - HG_PORT=${HG_PORT:-50045}
      - HG_USER=${HG_USER:-admin}
      - HG_PASSWD=${HG_PASSWD:-admin}
      - HG_GRAPHSPACE=${HG_GRAPHSPACE:-DEFAULT}
      - HG_GRAPH=${HG_GRAPH:-edu}

      # ── OCR 服务 (外部) ──
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-http://202.107.249.39:50108/api/v1/construct-question/ocr-parse}

      # ── Milvus (服务器已运行，宿主机端口 8530->19530) ──
      - MILVUS_URI=http://127.0.0.1:8530
      - MILVUS_DB=llm_extract
      - MILVUS_QUESTION_COLLECTION=${MILVUS_QUESTION_COLLECTION:-question_embed_v1}
      - MILVUS_KP_COLLECTION=${MILVUS_KP_COLLECTION:-kp_embed_v1}

      # ── MySQL (服务器已运行，宿主机 127.0.0.1:3306) ──
      - MYSQL_URL=mysql+aiomysql://root:root@127.0.0.1:3306/llm_construct

      # ── Embedding ──
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_ENDPOINT=${EMBED_ENDPOINT:-/api/bgem3/encoder}
      - EMBED_LOAD_SERVICE=${EMBED_LOAD_SERVICE:-llm_search}
      - EMBED_DIM=${EMBED_DIM:-1024}
      - EMBED_TIMEOUT=${EMBED_TIMEOUT:-60.0}
      - EMBED_KP_MATCH_THRESHOLD=${EMBED_KP_MATCH_THRESHOLD:-0.75}
      - EMBED_KP_TOP_K=${EMBED_KP_TOP_K:-5}

      # ── App ──
      - DEBUG=${DEBUG:-false}
      - OUTPUT_DIR=${OUTPUT_DIR:-tmp/extractions}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
    volumes:
      - app-tmp:/app/tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  app-tmp:
